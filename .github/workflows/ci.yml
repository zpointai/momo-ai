name: Windows public candidate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node --test scripts/check-public-history.test.mjs
      - run: node scripts/check-public-history.mjs
      - run: npm ci
      - run: npm run setup:dependencies
      - run: npm --prefix cloud/mo-relay ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:relay
      - run: npm run security:scan
      - run: npm run setup:native
      - run: npm run build
      - run: npm run test:native
      - run: node scripts/check-desktop-observer.mjs
      - run: npm run security:scan -- dist dist-electron/main.cjs dist-electron/preload.cjs dist-electron/storage-worker.cjs dist-electron/desktop-observer/momo-desktop-observer.exe dist-electron/relay-setup/momo-relay-setup.exe
